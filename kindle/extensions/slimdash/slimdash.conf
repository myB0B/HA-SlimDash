# Réglages de SlimDash pour Kindle (modifiables avec le Bloc-notes).

# Adresse de l'image : http://<IP de Home Assistant>:8099/<nom du dashboard>.png?view=<n° de vue>
# Si une clé d'accès est réglée dans SlimDash, ajoutez &k=<clé> à la fin.
URL="http://192.168.1.10:8099/tab3.png?view=0"

# Serveur de temps (NTP) pour garder le Kindle à l'heure, mises à jour pile à la minute.
# Exemple : l'IP de Home Assistant s'il fait serveur NTP. Laissez vide pour ne pas l'utiliser.
NTP="192.168.1.10"

# Intervalle entre deux mises à jour, en secondes (10 au minimum). Les mises à jour se calent
# sur l'horloge : 60 = pile à chaque minute.
INTERVAL=60

# Rafraîchissement complet de l'écran (efface les traces) toutes les N images.
FULL_EVERY=10
