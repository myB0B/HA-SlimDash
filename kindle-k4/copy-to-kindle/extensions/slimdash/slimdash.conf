# SlimDash settings for Kindle (edit with any text editor).

# Image address: http://<Home Assistant IP>:8099/<dashboard name>.png?view=<view number>
# If an access key is set in SlimDash, add &k=<key> at the end.
URL="http://192.168.1.10:8099/kindle.png?view=0"

# Time server (NTP) to keep the Kindle on time, updates exactly on the minute.
# Example: the Home Assistant IP if it acts as an NTP server. Leave empty to not use it.
NTP=""

# Interval between two updates, in seconds (10 at least). Updates are aligned
# on the clock: 60 = exactly every minute.
INTERVAL=60

# Full screen refresh (removes ghosting) every N images.
FULL_EVERY=10
